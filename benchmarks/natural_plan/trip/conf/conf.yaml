llm:
  timeout: 180  # seconds; prevents hang on stalled HTTP calls
  model: gemini/gemini-3.1-flash-lite

pathto:
  task: ${pathto.repo}/benchmarks/natural_plan/trip
  logs: ${pathto.task}

cachier:
  cache_dir: ${pathto.task}/llm_cache

evaluate:
  result_dir: ${pathto.logs}/results
  expt_name: DEFAULT
  root_interface: ptools.trip_planning
  record_details: true

dataset:
  split: valid
  shuffle_seed: 42

ptools:
  parse_trip_constraints:
    method: simulate
  find_valid_route:
    method: simulate
  build_trip_plan:
    method: simulate
  trip_planning:
    method: DEFAULT
