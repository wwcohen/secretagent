llm:
  timeout: 180  # seconds; prevents hang on stalled HTTP calls
  model: gemini/gemini-3.1-flash-lite

cachier:
  cache_dir: ${oc.env:PATHTO_REPO}/benchmarks/natural_plan/trip/llm_cache

evaluate:
  result_dir: ${oc.env:PATHTO_REPO}/benchmarks/natural_plan/trip/results
  expt_name: DEFAULT
  root_interface: ptools.trip_planning
  record_details: true

dataset:
  split: valid
  shuffle_seed: 42

ptools:
  parse_trip_constraints:
    method: simulate
  find_valid_route:
    method: simulate
  build_trip_plan:
    method: simulate
  trip_planning:
    method: DEFAULT
