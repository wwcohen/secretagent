llm:
  model: gemini/gemini-3.1-flash-lite
  timeout: 180  # seconds; prevents hang on stalled HTTP calls

pathto:
  task: ${pathto.repo}/benchmarks/natural_plan/calendar
  logs: ${pathto.task}

cachier:
  cache_dir: ${pathto.task}/llm_cache

evaluate:
  result_dir: ${pathto.logs}/results
  expt_name: DEFAULT
  root_interface: ptools.calendar_scheduling
  record_details: true

dataset:
  split: valid
  shuffle_seed: 42

ptools:
  parse_schedules:
    method: simulate
  find_available_slots:
    method: simulate
  select_and_format:
    method: simulate
  calendar_scheduling:
    method: DEFAULT
