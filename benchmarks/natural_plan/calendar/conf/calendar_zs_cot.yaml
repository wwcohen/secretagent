# Zero-shot CoT for natplan calendar — used to source CoT trajectories
# for codedistill-induced-ptools (Class 3).
llm:
  model: together_ai/deepseek-ai/DeepSeek-V3.1

cachier:
  cache_dir: ${oc.env:PATHTO_REPO}/benchmarks/natural_plan/calendar/llm_cache
  enable_caching: false

evaluate:
  expt_name: calendar_zs_cot
  result_dir: ${oc.env:PATHTO_REPO}/benchmarks/natural_plan/calendar/results
  root_interface: ptools.calendar_scheduling
  record_details: true

dataset:
  split: train
  shuffle_seed: 42

ptools:
  parse_schedules:
    method: simulate
  find_available_slots:
    method: simulate
  select_and_format:
    method: simulate
  calendar_scheduling:
    method: prompt_llm
    prompt_template_file: prompt_templates/calendar_zs_cot.txt
