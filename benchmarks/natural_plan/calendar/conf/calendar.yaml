llm:
  model: gemini/gemini-3.1-flash-lite
  timeout: 180  # seconds; prevents hang on stalled HTTP calls

cachier:
  cache_dir: ${oc.env:PATHTO_REPO}/benchmarks/natural_plan/calendar/llm_cache

evaluate:
  result_dir: ${oc.env:PATHTO_REPO}/benchmarks/natural_plan/calendar/results
  expt_name: DEFAULT
  root_interface: ptools.calendar_scheduling
  record_details: true

dataset:
  split: valid
  shuffle_seed: 42

ptools:
  parse_schedules:
    method: simulate
  find_available_slots:
    method: simulate
  select_and_format:
    method: simulate
  calendar_scheduling:
    method: DEFAULT
