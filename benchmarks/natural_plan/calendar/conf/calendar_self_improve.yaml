llm:
  model: together_ai/deepseek-ai/DeepSeek-V3.1

improve:
  model: together_ai/Qwen/Qwen3.5-397B-A17B

orchestrate:
  model: together_ai/Qwen/Qwen3.5-397B-A17B

pathto:
  task: ${pathto.repo}/benchmarks/natural_plan/calendar
  logs: ${pathto.task}

cachier:
  cache_dir: ${pathto.task}/llm_cache
  enable_caching: false

evaluate:
  result_dir: ${pathto.logs}/results
  expt_name: calendar_self_improve
  root_interface: ptools.calendar_scheduling
  record_details: true

dataset:
  split: train
  shuffle_seed: 42

ptools:
  extract_constraints:
    method: simulate
  solve_problem:
    method: simulate
  format_answer:
    method: simulate
  calendar_scheduling:
    method: simulate
