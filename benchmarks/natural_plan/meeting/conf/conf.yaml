llm:
  model: gemini/gemini-3.1-flash-lite
  timeout: 180  # seconds; prevents hang on stalled HTTP calls

cachier:
  cache_dir: ${oc.env:PATHTO_REPO}/benchmarks/natural_plan/meeting/llm_cache

evaluate:
  result_dir: ${oc.env:PATHTO_REPO}/benchmarks/natural_plan/meeting/results
  expt_name: DEFAULT
  root_interface: ptools.meeting_planning
  record_details: true

dataset:
  split: valid
  shuffle_seed: 42

ptools:
  parse_meeting_info:
    method: simulate
  plan_visit_order:
    method: simulate
  build_meeting_plan:
    method: simulate
  meeting_planning:
    method: DEFAULT
