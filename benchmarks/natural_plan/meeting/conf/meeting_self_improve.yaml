llm:
  model: together_ai/deepseek-ai/DeepSeek-V3.1

improve:
  model: together_ai/Qwen/Qwen3.5-397B-A17B

orchestrate:
  model: together_ai/Qwen/Qwen3.5-397B-A17B

cachier:
  cache_dir: ${oc.env:PATHTO_REPO}/benchmarks/natural_plan/meeting/llm_cache
  enable_caching: false

evaluate:
  result_dir: ${oc.env:PATHTO_REPO}/benchmarks/natural_plan/meeting/results
  expt_name: meeting_self_improve
  root_interface: ptools.meeting_planning
  record_details: true

dataset:
  split: train
  shuffle_seed: 42

ptools:
  extract_constraints:
    method: simulate
  solve_problem:
    method: simulate
  format_answer:
    method: simulate
  meeting_planning:
    method: simulate
