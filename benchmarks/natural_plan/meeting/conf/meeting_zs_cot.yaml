# Zero-shot CoT for natplan meeting — Class 3 trace source
llm:
  model: together_ai/deepseek-ai/DeepSeek-V3.1
  timeout: 180

cachier:
  cache_dir: ${oc.env:PATHTO_REPO}/benchmarks/natural_plan/meeting/llm_cache
  enable_caching: true

evaluate:
  expt_name: meeting_zs_cot
  result_dir: ${oc.env:PATHTO_REPO}/benchmarks/natural_plan/meeting/results
  root_interface: ptools.meeting_planning
  record_details: true

dataset:
  split: train
  shuffle_seed: 42

ptools:
  parse_meeting_info:
    method: simulate
  plan_visit_order:
    method: simulate
  build_meeting_plan:
    method: simulate
  meeting_planning:
    method: prompt_llm
    prompt_template_file: prompt_templates/meeting_zs_cot.txt
