llm:
#  model: together_ai/deepseek-ai/DeepSeek-V3.1
  model: gemini/gemini-3.1-flash-lite

pathto:
  task: ${pathto.repo}/benchmarks/bbh/sports_understanding
  logs: ${pathto.task}

cachier:
  cache_dir: ${pathto.task}/llm_cache

evaluate:
  result_dir: ${pathto.logs}/results
  expt_name: DEFAULT # means the expt isn't fully configured and should be discarded
  root_interface: ptools.are_sports_in_sentence_consistent

dataset:
  split: valid
  shuffle_seed: 137
  json_data_dir: ${pathto.task}/data

ptools:
  analyze_sentence:
    method: simulate
  sport_for:
    method: simulate
  consistent_sports:
    method: simulate
  are_sports_in_sentence_consistent:
    method: DEFAULT #should raise an error
