llm:
  model: gemini/gemini-3.1-flash-lite

cachier:
  cache_dir: ${oc.env:PATHTO_REPO}/benchmarks/musr/object/llm_cache

evaluate:
  result_dir: ${oc.env:PATHTO_REPO}/benchmarks/musr/object/results
  expt_name: DEFAULT # means the expt isn't fully configured and should be discarded
  root_interface: ptools.answer_question
dataset:
  split: valid
  shuffle_seed: 42
  json_data_dir: ${oc.env:PATHTO_REPO}/benchmarks/musr/object/data

ptools:
  extract_index:
    method: simulate
  extract_movements:
    method: simulate
  extract_discoveries:
    method: simulate
  infer_belief:
    method: simulate
  answer_question:
    method: DEFAULT # should raise error
