llm:
  model: gemini/gemini-3.1-flash-lite

pathto:
  task: ${pathto.repo}/benchmarks/musr/team
  logs: ${pathto.task}

cachier:
  cache_dir: ${pathto.task}/llm_cache

evaluate:
  result_dir: ${pathto.logs}/results
  expt_name: DEFAULT # means the expt isn't fully configured and should be discarded
  root_interface: ptools.answer_question
dataset:
  split: valid
  shuffle_seed: 42
  json_data_dir: ${pathto.task}/data

ptools:
  extract_index:
    method: simulate
  extract_team_requirements:
    method: simulate
  score_team_assignments:
    method: simulate
  answer_question:
    method: DEFAULT # should raise error
